<!doctype html>
<!--
  BEM EXECUTIVE · custom · captions
  Executive caption style for talking-head video. Phrases of 3-5 words rise
  into place in Lato; each word brightens from ivory to white as it is spoken,
  and emphasis words (numbers, the brand, names you list) turn gold. Optional
  navy plate with a gold hairline for busy footage.
  Transparent background. Format-adaptive: bottom-center in 16:9 and 1:1,
  lower-middle (clear of platform UI) in 9:16.

  HOW TO USE
  1. Replace the WORDS array in the script with the project's word-level
     transcript ([{ "text", "start", "end" }], seconds, EDITED footage).
  2. List brand / guest names in EMPH (numbers are automatic).
  3. Set data-duration to the edited video's length. Set data-plate="true"
     on the root for a navy plate behind each phrase.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #bem-captions {
        position: absolute; left: 0; top: 0; overflow: hidden;
        background: transparent;
      }

      /* full-width container, centered (no translateX centering — avoids edge clipping) */
      #bem-captions .group {
        position: absolute; left: 0; right: 0;
        bottom: calc(110 * var(--u));
        display: flex; justify-content: center;
        padding: 0 calc(120 * var(--u));
        opacity: 0; visibility: hidden;
      }
      #bem-captions.fmt-portrait .group { bottom: calc(620 * var(--u)); padding: 0 calc(70 * var(--u)); }
      #bem-captions.fmt-square .group   { bottom: calc(90 * var(--u));  padding: 0 calc(70 * var(--u)); }

      #bem-captions .line {
        position: relative;
        max-width: 100%;
        text-align: center;
        font-family: var(--font-body); font-weight: var(--wt-bold);
        font-size: calc(var(--cap) * var(--u)); line-height: 1.22;
        letter-spacing: 0.005em;
        text-shadow: 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(var(--navy-deep-rgb), 0.85),
                     0 0 calc(3 * var(--u)) rgba(var(--navy-deep-rgb), 0.9);
      }
      #bem-captions.fmt-landscape { --cap: 58; }
      #bem-captions.fmt-portrait  { --cap: 66; }
      #bem-captions.fmt-square    { --cap: 56; }

      #bem-captions .w { color: var(--ivory); opacity: 0.62; }
      #bem-captions .w.em { font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 1.12em; }

      /* optional plate */
      #bem-captions[data-plate="true"] .line {
        padding: calc(16 * var(--u)) calc(34 * var(--u)) calc(18 * var(--u));
        background: rgba(var(--navy-rgb), 0.82);
        text-shadow: none;
      }
      #bem-captions[data-plate="true"] .line::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0;
        height: calc(2 * var(--u)); background: var(--gold);
      }
    </style>
  </head>
  <body>
    <div id="bem-captions" class="bem-root"
         data-composition-id="bem-captions"
         data-start="0"
         data-duration="9"
         data-plate="false"
         data-width="1920"
         data-height="1080">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "bem-captions";
        var root = document.getElementById(ID);
        var W = +root.dataset.width, H = +root.dataset.height;
        root.style.width = W + "px"; root.style.height = H + "px";
        root.style.setProperty("--u", (Math.min(W, H) / 1080) + "px");
        var FMT = W > H * 1.1 ? "landscape" : H > W * 1.1 ? "portrait" : "square";
        root.classList.add("fmt-" + FMT);

        var DURATION = +root.dataset.duration || 9;
        /* word-level transcript (seconds, edited timeline) — replace per video */
        var WORDS = [
          { "text": "Black", "start": 0.30, "end": 0.62 },
          { "text": "Executive", "start": 0.62, "end": 1.10 },
          { "text": "Men", "start": 1.10, "end": 1.42 },
          { "text": "is", "start": 1.50, "end": 1.62 },
          { "text": "the", "start": 1.62, "end": 1.74 },
          { "text": "network", "start": 1.74, "end": 2.20 },
          { "text": "for", "start": 2.20, "end": 2.36 },
          { "text": "C-suite", "start": 2.36, "end": 2.90 },
          { "text": "executives", "start": 2.90, "end": 3.50 },
          { "text": "and", "start": 3.50, "end": 3.66 },
          { "text": "vice", "start": 3.66, "end": 3.92 },
          { "text": "presidents.", "start": 3.92, "end": 4.60 },
          { "text": "We're", "start": 5.10, "end": 5.30 },
          { "text": "sponsoring", "start": 5.30, "end": 5.86 },
          { "text": "10,000", "start": 5.86, "end": 6.60 },
          { "text": "Black", "start": 6.60, "end": 6.86 },
          { "text": "male", "start": 6.86, "end": 7.10 },
          { "text": "managers", "start": 7.10, "end": 7.60 },
          { "text": "into", "start": 7.60, "end": 7.80 },
          { "text": "executive", "start": 7.80, "end": 8.24 },
          { "text": "leadership.", "start": 8.24, "end": 8.80 }
        ];
        /* words or phrases set in gold (case-insensitive); numbers are automatic */
        var EMPH = ["Black Executive Men", "BEM", "C-suite", "leadership"];

        /* --- emphasis: mark words that belong to a listed phrase, plus numbers --- */
        var norm = function (t) { return t.toLowerCase().replace(/[^a-z0-9,\-]/g, ""); };
        var isEm = WORDS.map(function (w) { return /\d/.test(w.text); });
        EMPH.forEach(function (phrase) {
          var parts = phrase.split(/\s+/).map(norm);
          for (var i = 0; i + parts.length <= WORDS.length; i++) {
            var hit = parts.every(function (p, k) { return norm(WORDS[i + k].text) === p; });
            if (hit) for (var k = 0; k < parts.length; k++) isEm[i + k] = true;
          }
        });

        /* --- grouping: 3-5 words, break on sentence end, pauses, or length --- */
        var MAX_WORDS = 5, MAX_CHARS = FMT === "landscape" ? 34 : 22;
        var groups = [], cur = [];
        WORDS.forEach(function (w, i) {
          var chars = cur.reduce(function (n, j) { return n + WORDS[j].text.length + 1; }, 0);
          var prev = cur.length ? WORDS[cur[cur.length - 1]] : null;
          var pause = prev ? w.start - prev.end : 0;
          if (cur.length && (cur.length >= MAX_WORDS || chars + w.text.length > MAX_CHARS || pause > 0.35)) {
            groups.push(cur); cur = [];
          }
          cur.push(i);
          if (/[.!?]$/.test(w.text)) { groups.push(cur); cur = []; }
        });
        if (cur.length) groups.push(cur);

        /* --- build DOM --- */
        groups = groups.map(function (idx, gi) {
          var g = document.createElement("div"); g.className = "group"; g.id = "cg-" + gi;
          var line = document.createElement("div"); line.className = "line";
          idx.forEach(function (i, n) {
            var s = document.createElement("span");
            s.className = "w" + (isEm[i] ? " em" : "");
            s.textContent = WORDS[i].text;
            line.appendChild(s);
            if (n < idx.length - 1) line.appendChild(document.createTextNode(" "));
          });
          g.appendChild(line); root.appendChild(g);
          var start = WORDS[idx[0]].start;
          var end = WORDS[idx[idx.length - 1]].end + 0.25;
          return { el: g, words: idx, start: start, end: end };
        });
        /* never overlap: a group is fully gone before the next starts its entrance (start - 0.12) */
        for (var gi = 0; gi < groups.length - 1; gi++) {
          groups[gi].end = Math.min(groups[gi].end, groups[gi + 1].start - 0.14);
        }

        /* --- timeline --- */
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        groups.forEach(function (g) {
          var t0 = Math.max(0, g.start - 0.12);
          tl.set(g.el, { visibility: "visible" }, t0);
          tl.fromTo(g.el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, t0);
          var spans = g.el.querySelectorAll(".w");
          g.words.forEach(function (i, n) {
            var color = isEm[i] ? "#E0B264" : "#FFFFFF";
            tl.to(spans[n], { opacity: 1, color: color, duration: 0.18, ease: "power1.out" }, WORDS[i].start);
          });
          tl.to(g.el, { opacity: 0, duration: 0.18, ease: "power2.in" }, g.end - 0.18);
          tl.set(g.el, { opacity: 0, visibility: "hidden" }, g.end);
        });

        tl.set({}, {}, DURATION);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
